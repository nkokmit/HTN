events {}

http {
    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Frontend SPA routes that would otherwise collide with API prefixes.
        location = /login { try_files /index.html =404; }
        location = /register { try_files /index.html =404; }
        location = /books { try_files /index.html =404; }
        location = /cart { try_files /index.html =404; }
        location = /order { try_files /index.html =404; }
        location = /ratings { try_files /index.html =404; }
        location = /staff-books { try_files /index.html =404; }
        location ~ ^/book-[0-9]+$ { try_files /index.html =404; }
        location ~ ^/order-[0-9]+$ { try_files /index.html =404; }

        location / {
            try_files $uri /index.html;
        }

        location /book/ {
            proxy_pass http://book-service:8000/;
        }

        location /customer/ {
            proxy_pass http://customer-service:8000/;
        }

        location /cart/ {
            proxy_pass http://cart-service:8000/;
        }

        location /staff/ {
            proxy_pass http://staff-service:8000/;
        }

        location /manager/ {
            proxy_pass http://manager-service:8000/;
        }

        location /catalog/ {
            proxy_pass http://catalog-service:8000/;
        }

        location /order/ {
            proxy_pass http://order-service:8000/;
        }

        location /ship/ {
            proxy_pass http://ship-service:8000/;
        }

        location /pay/ {
            proxy_pass http://pay-service:8000/;
        }

        location /rating/ {
            proxy_pass http://comment-rate-service:8000/;
        }

        location /recommender/ {
            proxy_pass http://recommender-ai-service:8000/;
        }
    }
}
