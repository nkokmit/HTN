x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 5s

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8000"
    depends_on:
      frontend:
        condition: service_started
      user-service:
        condition: service_started
      cart-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      ship-service:
        condition: service_started
      pay-service:
        condition: service_started
      comment-rate-service:
        condition: service_started
      recommender-ai-service:
        condition: service_started

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
      POSTGRES_HOST: user-db
      POSTGRES_PORT: 5432
    depends_on:
      user-db:
        condition: service_healthy
      cart-service:
        condition: service_started
    ports:
      - "8002:8000"

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  cart-service:
    build: ./cart-service
    container_name: cart-service
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: cart_user
      POSTGRES_PASSWORD: cart_pass
      POSTGRES_HOST: cart-db
      POSTGRES_PORT: 5432
    depends_on:
      cart-db:
        condition: service_healthy
      product-service:
        condition: service_started
    ports:
      - "8003:8000"

  cart-db:
    image: postgres:16-alpine
    container_name: cart-db
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: cart_user
      POSTGRES_PASSWORD: cart_pass
    volumes:
      - cart_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
      POSTGRES_HOST: product-db
      POSTGRES_PORT: 5432
    depends_on:
      product-db:
        condition: service_healthy
    ports:
      - "8006:8000"

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_HOST: order-db
      POSTGRES_PORT: 5432
    depends_on:
      order-db:
        condition: service_healthy
      pay-service:
        condition: service_started
      ship-service:
        condition: service_started
    ports:
      - "8007:8000"

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  ship-service:
    build: ./ship-service
    container_name: ship-service
    environment:
      POSTGRES_DB: ship_db
      POSTGRES_USER: ship_user
      POSTGRES_PASSWORD: ship_pass
      POSTGRES_HOST: ship-db
      POSTGRES_PORT: 5432
    depends_on:
      ship-db:
        condition: service_healthy
    ports:
      - "8008:8000"

  ship-db:
    image: postgres:16-alpine
    container_name: ship-db
    environment:
      POSTGRES_DB: ship_db
      POSTGRES_USER: ship_user
      POSTGRES_PASSWORD: ship_pass
    volumes:
      - ship_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  pay-service:
    build: ./pay-service
    container_name: pay-service
    environment:
      POSTGRES_DB: pay_db
      POSTGRES_USER: pay_user
      POSTGRES_PASSWORD: pay_pass
      POSTGRES_HOST: pay-db
      POSTGRES_PORT: 5432
    depends_on:
      pay-db:
        condition: service_healthy
    ports:
      - "8009:8000"

  pay-db:
    image: postgres:16-alpine
    container_name: pay-db
    environment:
      POSTGRES_DB: pay_db
      POSTGRES_USER: pay_user
      POSTGRES_PASSWORD: pay_pass
    volumes:
      - pay_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  comment-rate-service:
    build: ./comment-rate-service
    container_name: comment-rate-service
    environment:
      POSTGRES_DB: comment_rate_db
      POSTGRES_USER: comment_rate_user
      POSTGRES_PASSWORD: comment_rate_pass
      POSTGRES_HOST: comment-rate-db
      POSTGRES_PORT: 5432
    depends_on:
      comment-rate-db:
        condition: service_healthy
    ports:
      - "8010:8000"

  comment-rate-db:
    image: postgres:16-alpine
    container_name: comment-rate-db
    environment:
      POSTGRES_DB: comment_rate_db
      POSTGRES_USER: comment_rate_user
      POSTGRES_PASSWORD: comment_rate_pass
    volumes:
      - comment_rate_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  recommender-ai-service:
    build: ./recommender-ai-service
    container_name: recommender-ai-service
    environment:
      POSTGRES_DB: recommender_db
      POSTGRES_USER: recommender_user
      POSTGRES_PASSWORD: recommender_pass
      POSTGRES_HOST: recommender-ai-db
      POSTGRES_PORT: 5432
    depends_on:
      recommender-ai-db:
        condition: service_healthy
      comment-rate-service:
        condition: service_started
      product-service:
        condition: service_started
    ports:
      - "8011:8000"

  recommender-ai-db:
    image: postgres:16-alpine
    container_name: recommender-ai-db
    environment:
      POSTGRES_DB: recommender_db
      POSTGRES_USER: recommender_user
      POSTGRES_PASSWORD: recommender_pass
    volumes:
      - recommender_ai_db_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

volumes:
  user_db_data:
  cart_db_data:
  product_db_data:
  order_db_data:
  ship_db_data:
  pay_db_data:
  comment_rate_db_data:
  recommender_ai_db_data:
