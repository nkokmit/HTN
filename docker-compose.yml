services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8000"
    depends_on:
      - book-service
      - customer-service
      - cart-service
      - staff-service
      - manager-service
      - catalog-service
      - order-service
      - ship-service
      - pay-service
      - comment-rate-service
      - recommender-ai-service
      - clothes-service

  book-service:
    build: ./book-service
    container_name: book-service
    environment:
      POSTGRES_DB: book_db
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_pass
      POSTGRES_HOST: book-db
      POSTGRES_PORT: 5432
    depends_on:
      - book-db
    ports:
      - "8001:8000"

  book-db:
    image: postgres:16-alpine
    container_name: book-db
    environment:
      POSTGRES_DB: book_db
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_pass
    volumes:
      - book_db_data:/var/lib/postgresql/data

  customer-service:
    build: ./customer-service
    container_name: customer-service
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_pass
      POSTGRES_HOST: customer-db
      POSTGRES_PORT: 5432
    depends_on:
      - customer-db
      - cart-service
    ports:
      - "8002:8000"

  customer-db:
    image: postgres:16-alpine
    container_name: customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_pass
    volumes:
      - customer_db_data:/var/lib/postgresql/data

  cart-service:
